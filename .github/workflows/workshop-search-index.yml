name: Build Workshop search index

on:
  workflow_call:
    inputs:
      job_timeout_minutes:
        description: Maximum duration of the build job
        required: false
        type: number
        default: 80
      map_metadata_max_items:
        description: Maximum number of map payloads to download per run
        required: false
        type: number
        default: 500
      map_payload_max_download_bytes:
        description: Maximum accepted size of one map payload
        required: false
        type: number
        default: 50000000
      steam_request_timeout_seconds:
        description: Timeout for one Steam callback
        required: false
        type: number
        default: 120
      steam_request_delay_seconds:
        description: Delay between Steam requests in normal mode
        required: false
        type: number
        default: 0
      steam_slow_mode_delay_seconds:
        description: Delay between Steam requests in slow mode
        required: false
        type: number
        default: 40
      map_index_time_budget_seconds:
        description: Time budget for cached analysis and Steam payload collection
        required: false
        type: number
        default: 3600
      map_analysis_parallelism:
        description: Maximum parallelism for cached payload analysis
        required: false
        type: number
        default: 4
      steam_reconnect_after_downloads:
        description: Download requests per anonymous Steam session; zero disables reconnects
        required: false
        type: number
        default: 250
      payload_cache_prune_max_versions:
        description: Maximum number of superseded payload cache versions to prune
        required: false
        type: number
        default: 100
  workflow_dispatch:
    inputs:
      job_timeout_minutes:
        description: Maximum duration of the build job
        required: false
        type: number
        default: 80
      map_metadata_max_items:
        description: Maximum number of map payloads to download per run
        required: false
        type: number
        default: 500
      map_payload_max_download_bytes:
        description: Maximum accepted size of one map payload
        required: false
        type: number
        default: 50000000
      steam_request_timeout_seconds:
        description: Timeout for one Steam callback
        required: false
        type: number
        default: 120
      steam_request_delay_seconds:
        description: Delay between Steam requests in normal mode
        required: false
        type: number
        default: 0
      steam_slow_mode_delay_seconds:
        description: Delay between Steam requests in slow mode
        required: false
        type: number
        default: 40
      map_index_time_budget_seconds:
        description: Time budget for cached analysis and Steam payload collection
        required: false
        type: number
        default: 3600
      map_analysis_parallelism:
        description: Maximum parallelism for cached payload analysis
        required: false
        type: number
        default: 4
      steam_reconnect_after_downloads:
        description: Download requests per anonymous Steam session; zero disables reconnects
        required: false
        type: number
        default: 250
      payload_cache_prune_max_versions:
        description: Maximum number of superseded payload cache versions to prune
        required: false
        type: number
        default: 100
  schedule:
    - cron: "17 0-23/3 * * *"
    - cron: "47 1-23/3 * * *"

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: workshop-search-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job_timeout_minutes || 80 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.100

      - name: Build public Workshop indexer
        run: dotnet build tools/SteamWorkshopIndexer/SteamWorkshopIndexer.csproj -c Release

      - name: Build anonymous Workshop map metadata indexer
        run: dotnet build tools/SteamWorkshopMapMetadataIndexer/SteamWorkshopMapMetadataIndexer.csproj -c Release

      - name: Install anonymous Steam game-server runtime
        run: |
          mkdir -p "$RUNNER_TEMP/steamcmd" "$HOME/.steam/sdk64"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            --output "$RUNNER_TEMP/steamcmd_linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd_linux.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit
          test -s "$RUNNER_TEMP/steamcmd/linux64/steamclient.so"
          mkdir -p \
            "$RUNNER_TEMP/steamcmd/steamapps/common/Timberborn" \
            "$RUNNER_TEMP/steamcmd/steamapps/downloading/1062090" \
            "$RUNNER_TEMP/steamcmd/steamapps/workshop/content/1062090" \
            "$RUNNER_TEMP/steamcmd/steamapps/workshop/downloads"
          printf '%s\n' \
            '"AppState"' \
            '{' \
            '  "appid" "1062090"' \
            '  "name" "Timberborn"' \
            '  "StateFlags" "4"' \
            '  "installdir" "Timberborn"' \
            '}' \
            > "$RUNNER_TEMP/steamcmd/steamapps/appmanifest_1062090.acf"
          printf '%s\n' \
            '"libraryfolders"' \
            '{' \
            '  "0"' \
            '  {' \
            "    \"path\" \"$RUNNER_TEMP/steamcmd\"" \
            '    "apps"' \
            '    {' \
            '      "1062090" "0"' \
            '    }' \
            '  }' \
            '}' \
            > "$RUNNER_TEMP/steamcmd/steamapps/libraryfolders.vdf"
          cp "$RUNNER_TEMP/steamcmd/linux64/steamclient.so" "$HOME/.steam/sdk64/steamclient.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/steamcmd/linux64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Collect public Workshop metadata
        env:
          SteamAppId: "1062090"
          SteamGameId: "1062090"
          STEAM_REQUEST_TIMEOUT_SECONDS: ${{ inputs.steam_request_timeout_seconds }}
        working-directory: ${{ runner.temp }}/steamcmd
        run: >-
          dotnet $GITHUB_WORKSPACE/tools/SteamWorkshopIndexer/bin/Release/net8.0/SteamWorkshopIndexer.dll
          --output $GITHUB_WORKSPACE/.work/workshop-items.jsonl
          --request-timeout-seconds ${STEAM_REQUEST_TIMEOUT_SECONDS:-120}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download previous incremental data
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl --fail --location --retry 3 \
            --output .work/previous-map-metadata.jsonl.gz \
            "$site/map-metadata.jsonl.gz" \
            || rm -f .work/previous-map-metadata.jsonl.gz

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Collect exact map features from anonymous payloads
        env:
          SteamAppId: "1062090"
          SteamGameId: "1062090"
          MAP_PAYLOAD_CACHE_OCI_REPOSITORY: ghcr.io/ihsoft/timberborn-workshop-payload-cache
          MAP_METADATA_MAX_ITEMS: ${{ inputs.map_metadata_max_items }}
          MAP_PAYLOAD_MAX_DOWNLOAD_BYTES: ${{ inputs.map_payload_max_download_bytes }}
          STEAM_REQUEST_TIMEOUT_SECONDS: ${{ inputs.steam_request_timeout_seconds }}
          STEAM_REQUEST_DELAY_SECONDS: ${{ inputs.steam_request_delay_seconds }}
          STEAM_SLOW_MODE_DELAY_SECONDS: ${{ inputs.steam_slow_mode_delay_seconds }}
          MAP_INDEX_TIME_BUDGET_SECONDS: ${{ inputs.map_index_time_budget_seconds }}
          MAP_ANALYSIS_PARALLELISM: ${{ inputs.map_analysis_parallelism }}
          STEAM_RECONNECT_AFTER_DOWNLOADS: ${{ inputs.steam_reconnect_after_downloads }}
          STOP_REQUEST_FILE: ${{ runner.temp }}/workshop-index-stop-requested
          STOP_REQUEST_REPOSITORY_PATH: .github/workshop-search-index-stop
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/steamcmd
        run: |
          stop_poll_seconds=30

          monitor_stop_request() {
            while true; do
              if encoded_request=$(gh api \
                  "repos/$GITHUB_REPOSITORY/contents/$STOP_REQUEST_REPOSITORY_PATH?ref=main" \
                  --jq .content 2>/dev/null); then
                target_run_id=$(printf '%s' "$encoded_request" | base64 --decode | tr -d '[:space:]')
                if [ "$target_run_id" = "$GITHUB_RUN_ID" ]; then
                  : > "$STOP_REQUEST_FILE"
                  echo "Graceful stop request received for workflow run $GITHUB_RUN_ID."
                  return
                fi
              else
                echo "Could not read the graceful stop request from the repository." >&2
              fi
              sleep "$stop_poll_seconds"
            done
          }

          monitor_stop_request &
          stop_monitor_pid=$!
          cleanup_stop_monitor() {
            kill "$stop_monitor_pid" 2>/dev/null || true
            wait "$stop_monitor_pid" 2>/dev/null || true
          }
          trap cleanup_stop_monitor EXIT

          dotnet $GITHUB_WORKSPACE/tools/SteamWorkshopMapMetadataIndexer/bin/Release/net8.0/SteamWorkshopMapMetadataIndexer.dll \
            --snapshot $GITHUB_WORKSPACE/.work/workshop-items.jsonl \
            --previous-results $GITHUB_WORKSPACE/.work/previous-map-metadata.jsonl.gz \
            --output $GITHUB_WORKSPACE/.work/map-metadata.jsonl \
            --workshop-directory $RUNNER_TEMP/steamcmd/workshop-content \
            --max-items ${MAP_METADATA_MAX_ITEMS:-500} \
            --max-download-bytes ${MAP_PAYLOAD_MAX_DOWNLOAD_BYTES:-50000000} \
            --request-timeout-seconds ${STEAM_REQUEST_TIMEOUT_SECONDS:-120} \
            --request-delay-seconds ${STEAM_REQUEST_DELAY_SECONDS:-0} \
            --slow-mode-delay-seconds ${STEAM_SLOW_MODE_DELAY_SECONDS:-40} \
            --time-budget-seconds ${MAP_INDEX_TIME_BUDGET_SECONDS:-3600} \
            --max-analysis-parallelism ${MAP_ANALYSIS_PARALLELISM:-4} \
            --steam-reconnect-after-downloads ${STEAM_RECONNECT_AFTER_DOWNLOADS:-250} \
            --stop-request-file "$STOP_REQUEST_FILE"

      - name: Build public search artifacts
        run: >-
          python tools/TimberbornWorkshopSearchIndexPublisher/build_public_index.py
          --snapshot .work/workshop-items.jsonl
          --map-metadata .work/map-metadata.jsonl
          --output-directory .work/public

      - name: Enforce public artifact size limit
        run: |
          bytes=$(du -sb .work/public | cut -f1)
          echo "Public artifact size: $bytes bytes"
          test "$bytes" -le 100000000

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v6
        with:
          name: timberborn-workshop-search-index
          path: .work/public
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .work/public

      - name: Prune superseded payload cache versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_CACHE_PRUNE_MAX_VERSIONS: ${{ inputs.payload_cache_prune_max_versions }}
        run: |
          package_path="/users/ihsoft/packages/container/timberborn-workshop-payload-cache"
          prune_limit="${PAYLOAD_CACHE_PRUNE_MAX_VERSIONS:-100}"
          version_ids=$(gh api --paginate "$package_path/versions?per_page=100" \
            --jq '.[] | select((.metadata.container.tags // []) | length == 0) | .id' \
            | head -n "$prune_limit")
          if [ -z "$version_ids" ]; then
            echo "No superseded payload cache versions to prune."
            exit 0
          fi
          pruned_versions=0
          while IFS= read -r version_id; do
            gh api --method DELETE "$package_path/versions/$version_id"
            pruned_versions=$((pruned_versions + 1))
            if ((pruned_versions % 10 == 0)); then
              echo "Pruned $pruned_versions superseded payload cache versions so far."
            fi
          done <<< "$version_ids"
          echo "Pruned $pruned_versions superseded payload cache versions."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

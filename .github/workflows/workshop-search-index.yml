name: Build Workshop search index

on:
  workflow_call:
    inputs:
      gallery_max_items:
        description: Maximum number of map galleries to refresh
        required: false
        type: number
        default: 250
      gallery_delay_milliseconds:
        description: Delay between anonymous UGC batches
        required: false
        type: number
        default: 250
      image_download_concurrency:
        description: Concurrent preview image downloads
        required: false
        type: number
        default: 6
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workshop-search-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.100

      - name: Build public Workshop indexer
        run: dotnet build tools/SteamWorkshopIndexer/SteamWorkshopIndexer.csproj -c Release

      - name: Build anonymous Workshop gallery indexer
        run: dotnet build tools/SteamWorkshopGalleryIndexer/SteamWorkshopGalleryIndexer.csproj -c Release

      - name: Collect public Workshop metadata
        run: >-
          dotnet tools/SteamWorkshopIndexer/bin/Release/net8.0/SteamWorkshopIndexer.dll
          --skip-previews
          --output .work/workshop-items.jsonl

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download previous incremental data
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl --fail --location --retry 3 \
            --output .work/previous-map-visual-features.jsonl.gz \
            "$site/map-visual-features.jsonl.gz" \
            || rm -f .work/previous-map-visual-features.jsonl.gz
          curl --fail --location --retry 3 \
            --output .work/previous-map-gallery.jsonl.gz \
            "$site/map-gallery.jsonl.gz" \
            || rm -f .work/previous-map-gallery.jsonl.gz

      - name: Install anonymous Steam game-server runtime
        run: |
          mkdir -p "$RUNNER_TEMP/steamcmd" "$HOME/.steam/sdk64"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            --output "$RUNNER_TEMP/steamcmd_linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd_linux.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit
          test -s "$RUNNER_TEMP/steamcmd/linux64/steamclient.so"
          cp "$RUNNER_TEMP/steamcmd/linux64/steamclient.so" "$HOME/.steam/sdk64/steamclient.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/steamcmd/linux64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Collect incremental public map galleries
        env:
          SteamAppId: "1062090"
          SteamGameId: "1062090"
        run: >-
          dotnet tools/SteamWorkshopGalleryIndexer/bin/Release/net8.0/SteamWorkshopGalleryIndexer.dll
          --snapshot .work/workshop-items.jsonl
          --previous-results .work/previous-map-gallery.jsonl.gz
          --output .work/map-gallery.jsonl
          --batch-size 100
          --max-items ${{ inputs.gallery_max_items || 250 }}
          --max-images-per-map 8
          --delay-milliseconds ${{ inputs.gallery_delay_milliseconds || 250 }}

      - name: Plan incremental classification
        id: classification-plan
        run: |
          python tools/TimberbornMapPreviewClassifier/classify.py \
            --snapshot .work/workshop-items.jsonl \
            --previous-results .work/previous-map-visual-features.jsonl.gz \
            --gallery-results .work/map-gallery.jsonl \
            --download-previews \
            --plan-only \
            --plan-output .work/classification-plan.json
          requires_model=$(python -c "import json; print(str(json.load(open('.work/classification-plan.json'))['requires_model']).lower())")
          echo "requires_model=$requires_model" >> "$GITHUB_OUTPUT"

      - name: Restore CLIP model cache
        if: steps.classification-plan.outputs.requires_model == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: clip-openai-vit-base-patch32-python-3.12-v1

      - name: Install CPU classifier dependencies
        if: steps.classification-plan.outputs.requires_model == 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          python -m pip install -r tools/TimberbornMapPreviewClassifier/requirements.txt

      - name: Classify map previews without retaining images
        run: >-
          python tools/TimberbornMapPreviewClassifier/classify.py
          --snapshot .work/workshop-items.jsonl
          --previous-results .work/previous-map-visual-features.jsonl.gz
          --gallery-results .work/map-gallery.jsonl
          --output .work/map-visual-features.jsonl
          --download-previews
          --download-concurrency ${{ inputs.image_download_concurrency || 6 }}
          --batch-size 24
          --max-image-bytes 2000000

      - name: Build public search artifacts
        run: >-
          python tools/TimberbornMapPreviewClassifier/build_public_index.py
          --snapshot .work/workshop-items.jsonl
          --visual-features .work/map-visual-features.jsonl
          --gallery-results .work/map-gallery.jsonl
          --output-directory .work/public

      - name: Enforce public artifact size limit
        run: |
          bytes=$(du -sb .work/public | cut -f1)
          echo "Public artifact size: $bytes bytes"
          test "$bytes" -le 100000000

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v6
        with:
          name: timberborn-workshop-search-index
          path: .work/public
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .work/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Probe anonymous Steam UGC previews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.100

      - name: Build anonymous UGC probe
        run: dotnet build tools/SteamAnonymousUgcProbe/SteamAnonymousUgcProbe.csproj -c Release

      - name: Install anonymous Steam game-server runtime
        run: |
          mkdir -p "$RUNNER_TEMP/steamcmd" "$HOME/.steam/sdk64"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            --output "$RUNNER_TEMP/steamcmd_linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd_linux.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit
          test -s "$RUNNER_TEMP/steamcmd/linux64/steamclient.so"
          cp "$RUNNER_TEMP/steamcmd/linux64/steamclient.so" "$HOME/.steam/sdk64/steamclient.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/steamcmd/linux64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Query additional previews without a Steam account
        env:
          SteamAppId: "1062090"
          SteamGameId: "1062090"
        run: >-
          dotnet tools/SteamAnonymousUgcProbe/bin/Release/net8.0/SteamAnonymousUgcProbe.dll
          3535425318 3532441249 3383139185
